name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build backend
        run: npm run build -w server

      - name: Build frontend
        run: npm run build -w client

      - name: Smoke test production API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -e
          url="https://idiomas-pro-client.vercel.app/api/health"
          for attempt in {1..18}; do
            echo "Tentativa $attempt: $url"
            response="$(curl -fsS --max-time 15 "$url" 2>/dev/null || true)"
            echo "$response"
            if echo "$response" | grep -q '"status":"ok"'; then
              echo "API em produção está saudável."
              exit 0
            fi
            sleep 10
          done
          echo "A API de produção não respondeu com status ok."
          exit 1
