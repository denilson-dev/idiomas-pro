name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres@127.0.0.1:5432/idiomas_pro_test?schema=public

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: idiomas_pro_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d idiomas_pro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm install

      - name: Install data pipeline runtime
        run: pip install "psycopg[binary]==3.2.10"

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply test database migrations
        run: npm run db:deploy

      - name: Seed test database
        run: npm run db:seed

      - name: Validate administrator bootstrap in production mode
        run: NODE_ENV=production npm run admin:ensure

      - name: Validate data engineering Python
        run: |
          python -m py_compile data-engineering/pipeline.py
          python -m py_compile data-engineering/synthetic/generate.py
          python -m py_compile data-engineering/airflow/dags/idiomas_pro_analytics.py

      - name: Run PostgreSQL analytics pipeline
        run: python data-engineering/pipeline.py run-all

      - name: Unit and component tests
        run: npm run test:unit

      - name: API integration tests
        run: npm run test:api

      - name: Build backend
        run: npm run build -w server

      - name: Build frontend
        run: npm run build -w client

      - name: Verify Render-compatible port binding
        env:
          PORT: 10000
        run: |
          set -euo pipefail
          npm start > /tmp/idiomas-pro-server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/api/health > /tmp/idiomas-pro-health.json; then
              cat /tmp/idiomas-pro-health.json
              exit 0
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Servidor encerrou antes de abrir a porta 10000."
              cat /tmp/idiomas-pro-server.log
              exit 1
            fi

            sleep 1
          done

          echo "Servidor não abriu 0.0.0.0:10000 dentro do tempo esperado."
          cat /tmp/idiomas-pro-server.log
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npx playwright test
