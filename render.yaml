services:
  - type: web
    name: idiomas-pro
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install && npm run build:render
    startCommand: npm run render:start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: DATABASE_URL
        fromDatabase:
          name: idiomas-pro-db
          property: connectionString

databases:
  - name: idiomas-pro-db
    plan: free
    region: virginia
    databaseName: idiomas_pro
    user: idiomas_pro
    ipAllowList: []
