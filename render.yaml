services:
  - type: web
    name: idiomas-pro
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --include=dev && npm run build:render && npm run admin:ensure && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: DATABASE_URL
        fromDatabase:
          name: idiomas-pro-db
          property: connectionString
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: GOOGLE_TTS_VOICE
        value: es-ES-Chirp3-HD-Zephyr

databases:
  - name: idiomas-pro-db
    plan: free
    region: virginia
    databaseName: idiomas_pro
    user: idiomas_pro
    ipAllowList: []
